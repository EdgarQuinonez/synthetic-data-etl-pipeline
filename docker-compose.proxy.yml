services:
  nifi:
    image: apache/nifi:2.11.0
    container_name: nifi
    network_mode: host
    restart: unless-stopped
    depends_on:
      - cloud-sql-proxy
    environment:
      NIFI_WEB_HTTPS_HOST: "0.0.0.0"
      NIFI_JVM_HEAP_INIT: "1g"
      NIFI_JVM_HEAP_MAX: "1g"
    volumes:
      - /opt/nifi/lib/postgresql-42.7.5.jar:/opt/nifi/nifi-current/lib/postgresql-42.7.5.jar:ro

  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.15.2
    container_name: cloud-sql-proxy
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    command:
      - "data-etl-pipeline-506215:us-central1:synthetic-postgres"
      - "--address=127.0.0.1"
      - "--port=5432"
      - "--credentials-file=/credentials/sql-proxy-sa.json"
    volumes:
      - /home/glowbo/.config/gcloud/sql-proxy-sa.json:/credentials/sql-proxy-sa.json:ro